# SP1 guest WITHOUT the patches (baseline for cycle counts) (see ../README.md).
[package]
name = "unicity-sp1-guest-unpatched"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of the SDK crate or any workspace of it.
[workspace]

[dependencies]
unicity-token = { path = "../../..", default-features = false, features = ["alloc"] }
sp1-zkvm = "6.0.0"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[[bin]]
name = "unicity-sp1-guest-unpatched"
path = "../guest/src/main.rs"
